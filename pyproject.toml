[project]
name = "claude-code-notifier"
version = "0.1.0"
description = "Desktop notifications for Claude Code events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.25.0",
    "mergedeep>=1.3.4",
    "pystray>=0.19.5; sys_platform == 'win32'",
    "winotify>=1.0.0; sys_platform == 'win32'",
    "Pillow>=10.0.0; sys_platform == 'win32'",
]

[project.scripts]
notifier-hook = "notifier.cli.hook:main"
notifier-feishu = "notifier.cli.feishu:main"
notifier-config = "notifier.cli.config:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["src/notifier/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
