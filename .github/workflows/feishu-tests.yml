name: Feishu Notifier Tests

on:
  push:
    branches:
      - agent/feishu-webhook-notifier-20261012
      - agent/feishu-wsl-integration-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feishu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -e ".[dev]"
      - name: Run the full applicable test suite
        run: python -m pytest -q
